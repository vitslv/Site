    <meta charset="UTF-8">

    <title>Categoria | Square3D</title>
    <link rel="stylesheet" href="style.css">
</head>

    <header>
        <a href="index.html">← Voltar</a>
        <h2>Square3D</h2>
    </header>
    <main>
        <section class="produto-detalhe">
            <h1 id="categoria-titulo">Categoria</h1>
            <p class="preco" id="categoria-preco">R$0,00</p>
            <p id="categoria-descricao"></p>

            <div class="produto-visual">
                <div class="produto-imagem-wrap">
                    <img id="selected-image" src="img/avulso.jpeg" alt="Produto selecionado">
                </div>

                <div class="produto-info-panel">
                    <h2 id="selected-title">Produto</h2>
                    <p class="selected-price" id="selected-price">R$0,00</p>
                    <p class="selected-note">Frete calculado antes da finalização.</p>

                    <div class="quantidade-box">
                        <span class="quantidade-label">Quantidade</span>
                        <div class="quantidade-control">
                            <button type="button" class="qty-btn" data-action="minus">−</button>
                            <span id="qty-value">1</span>
                            <button type="button" class="qty-btn" data-action="plus">+</button>
                        </div>
                    </div>

                    <button type="button" class="btn-principal">Compre já</button>
                </div>
            </div>

            <div id="produtos-grid" class="produtos-grid" aria-live="polite"></div>

            <ul id="categoria-lista"></ul>
        </section>
    </main>
    <style>/* ===== base ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #090b10;
    --card: #14181f;
    --text: #e8eef5;
    --muted: #9aa4b2;
    --accent: #0585fd;
    --accent-2: #00b8d4;
    --border: rgba(255, 255, 255, 0.08);
    --radius: 14px;
}

body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: #090b10;
    background-image:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.16) 0 1.2px, transparent 2.4px),
        radial-gradient(circle at 80% 12%, rgba(255,255,255,0.11) 0 1.4px, transparent 2.8px),
        radial-gradient(circle at 45% 72%, rgba(255,255,255,0.14) 0 1.1px, transparent 2.2px),
        radial-gradient(circle at 62% 38%, rgba(255,255,255,0.09) 0 1.6px, transparent 3.2px),
        radial-gradient(circle at 30% 60%, rgba(255,255,255,0.05) 0 2px, transparent 4px),
        linear-gradient(135deg, rgba(10, 14, 22, 0.92), rgba(7, 11, 18, 0.98));
    background-blend-mode: screen, screen, screen, screen, screen, multiply;
    background-size: 220px 220px, 260px 260px, 300px 300px, 340px 340px, 380px 380px, auto;
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
}

body.modal-open {
    overflow: hidden;
}

/* ===== header ===== */
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 5%;
    border-bottom: 1px solid var(--border);
    background: rgba(11, 13, 16, 0.92);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 10;
}

header a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.95rem;
    transition: color 0.25s;
}

header a:hover {
    color: var(--accent);
}

header h2 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem 1.2rem 4rem;
}

.produto-detalhe {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
}

.produto-detalhe h1 {
    font-size: clamp(2rem, 3vw, 3rem);
    font-weight: 800;
    margin-bottom: 0.6rem;
    letter-spacing: -0.05em;
    text-transform: uppercase;
    color: var(--text);
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.preco {
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 1rem;
}

.produto-detalhe > p {
    color: var(--muted);
    margin-bottom: 1.5rem;
    white-space: pre-line;
    max-width: 100%;
}

.produto-visual {
    display: grid;
    grid-template-columns: 1.5fr 0.9fr;
    gap: 2.5rem;
    align-items: center;
    margin: 2.5rem 0 3rem;
}

.produto-imagem-wrap {
    background: #f4f4f4;
    border-radius: 16px;
    overflow: hidden;
    min-height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.produto-imagem-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.produto-info-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 1rem;
    padding: 0.5rem 0;
}

.produto-info-panel h2 {
    font-size: clamp(2.3rem, 2.7vw, 4rem);
    line-height: 1.05;
    letter-spacing: -0.05em;
    font-weight: 800;
    color: #fff;
}

.selected-price {
    font-size: clamp(1.7rem, 2vw, 2.5rem);
    font-weight: 700;
    color: #fff;
    margin-top: 0.5rem;
}

.selected-note {
    color: #d2d7df;
    font-size: 1.05rem;
    margin: 0.2rem 0 0.3rem;
}

.quantidade-box {
    width: 100%;
    max-width: 240px;
    margin-top: 0.5rem;
}

.quantidade-label {
    display: block;
    color: var(--text);
    font-size: 1.05rem;
    margin-bottom: 0.7rem;
}

.quantidade-control {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 10px;
    background: rgba(255,255,255,0.02);
    height: 56px;
    padding: 0 1rem;
}

.qty-btn {
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 2rem;
    line-height: 1;
    cursor: pointer;
    padding: 0 0.5rem;
}

#qty-value {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text);
    min-width: 40px;
    text-align: center;
}

.btn-secundario,
.btn-principal {
    width: 100%;
    min-height: 64px;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.btn-secundario {
    border: 2px solid rgba(255, 255, 255, 0.7);
    background: transparent;
    color: var(--text);
    margin-top: 0.8rem;
}

.btn-principal {
    border: none;
    background: linear-gradient(135deg, var(--accent), #1d9bf0);
    color: #fff;
    box-shadow: 0 10px 20px rgba(5, 133, 253, 0.28);
}

.btn-secundario:hover,
.btn-principal:hover {
    transform: translateY(-2px);
}

.produtos-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(240px, 1fr));
    gap: 1.3rem;
    margin-top: 2rem;
    margin-bottom: 2rem;
}

.produto-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    padding: 0;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
    cursor: pointer;
    transition: transform 0.25s ease, border-color 0.25s ease;
}

.produto-card:hover {
    transform: translateY(-4px);
    border-color: rgba(5, 133, 253, 0.45);
}

.produto-card img {
    width: 100%;
    height: 290px;
    object-fit: cover;
    display: block;
    background: #10151c;
}

.produto-info {
    padding: 1rem 0.8rem 1.2rem;
    text-align: left;
}

.produto-nome {
    display: block;
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.3;
    text-transform: uppercase;
    color: var(--text);
}

.produto-preco {
    display: block;
    margin-top: 0.5rem;
    color: var(--text);
    font-size: 1.05rem;
    font-weight: 600;
}

.produto-detalhe ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    margin-top: 1rem;
}

.produto-detalhe li {
    position: relative;
    padding-left: 1.2rem;
    color: var(--text);
    font-size: 0.98rem;
}

.produto-detalhe li::before {
    content: "▸";
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: bold;
}

@media (max-width: 980px) {
    .produtos-grid {
        grid-template-columns: repeat(2, minmax(220px, 1fr));
    }
}

@media (max-width: 600px) {
    .produtos-grid {
        grid-template-columns: 1fr;
    }

    .produto-card img {
        height: 260px;
    }
}</style>

        const params = new URLSearchParams(window.location.search);
        const tipo = params.get('tipo') || 'acessorios';
        const dados = categorias[tipo] || categorias.acessorios;

        const selectedTitle = document.getElementById('selected-title');
        const selectedPrice = document.getElementById('selected-price');
        const selectedImage = document.getElementById('selected-image');
        const qtyValue = document.getElementById('qty-value');
        const btnComprar = document.querySelector('.btn-principal');

        let selectedQty = 1;
        let currentSelectedItem = null;

        function atualizarDetalheProduto(item) {
            currentSelectedItem = item;
            selectedTitle.textContent = item.nome;
            selectedPrice.textContent = item.preco;
            selectedImage.src = item.imagem;
            selectedImage.alt = item.nome;
            qtyValue.textContent = selectedQty;
        }

        document.getElementById('categoria-titulo').textContent = dados.titulo;
        document.getElementById('categoria-preco').textContent = dados.preco;
        document.getElementById('categoria-descricao').textContent = dados.descricao;

        const grid = document.getElementById('produtos-grid');
        grid.innerHTML = '';

        (dados.produtos || []).forEach((item, index) => {
            const card = document.createElement('article');
            card.className = 'produto-card';
            card.setAttribute('tabindex', '0');
            card.innerHTML = `
                <img src="${item.imagem}" alt="${item.nome}">
                <div class="produto-info">
                    <span class="produto-nome">${item.nome}</span>
                    <span class="produto-preco">${item.preco}</span>
                </div>
            `;

            card.addEventListener('click', () => {
                selectedQty = 1;
                atualizarDetalheProduto(item);
                document.querySelectorAll('.produto-card').forEach(el => el.style.borderColor = 'rgba(255,255,255,0.08)');
                card.style.borderColor = 'rgba(5, 133, 253, 0.8)';
            });

            card.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    card.click();
                }
            });

            grid.appendChild(card);

            if (index === 0) {
                selectedQty = 1;
                atualizarDetalheProduto(item);
                card.style.borderColor = 'rgba(5, 133, 253, 0.8)';
            }
        });

        document.querySelectorAll('.qty-btn').forEach(button => {
            button.addEventListener('click', () => {
                const action = button.dataset.action;
                const current = Number(qtyValue.textContent || '1');
                const next = action === 'plus' ? current + 1 : Math.max(1, current - 1);
                qtyValue.textContent = next;
                selectedQty = next;
            });
        });

        // Redireciona para a página de pagamento real (Mercado Pago / Stripe) do produto
        // selecionado. Quando você criar os Payment Links de cada produto, basta preencher
        // o campo "link" correspondente lá em cima, no objeto `categorias`.
        btnComprar.addEventListener('click', () => {
            if (!currentSelectedItem) return;

            if (!currentSelectedItem.link) {
                alert('Link de pagamento ainda não configurado para este produto.');
                return;
            }

            window.location.href = currentSelectedItem.link;
        });

        const lista = document.getElementById('categoria-lista');
        lista.innerHTML = '';
        dados.itens.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item;
            lista.appendChild(li);
        });
